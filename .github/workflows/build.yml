name: Build AyuGram Neon UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Neon patch repo
      uses: actions/checkout@v4
      with:
        path: neon

    - name: Clone official AyuGram v7.2.9 with submodules
      run: git clone --recursive --shallow-submodules --depth 1 --branch v7.2.9 https://github.com/AyuGram/AyuGramDesktop.git src

    - name: Patch prepare.py (fix MSYS2, jom, and dav1d)
      shell: pwsh
      run: |
        $file = "src/Telegram/build/prepare/prepare.py"
        $content = Get-Content $file -Raw
        
        # 1. Фикс устаревшего пакета diffutils
        $content = $content -replace 'mingw-w64-x86_64-diffutils', 'diffutils'
        
        # 2. Заменяем jom на nmake и убираем аргументы параллелизма
        $content = $content -replace 'jom\s+-j\S*\s+', 'nmake '
        $content = $content -replace 'jom\s+', 'nmake '
        
        # 3. Fix dav1d __has_include_next MSVC error (исправленный синтаксис Python)
        $lines = $content -split "`n"
        $newLines = @()
        foreach ($line in $lines) {
            $newLines += $line
            if ($line.Trim() -eq "'cd dav1d',") {
                $newLines += '            "powershell -Command \"(Get-Content include/compat/msvc/stdatomic.h -Raw) -replace ''__has_include_next\s*\(\s*<stdatomic\.h>\s*)'', ''0'' | Set-Content include/compat/msvc/stdatomic.h -NoNewline\"",'
            }
        }
        $content = $newLines -join "`n"
        
        Set-Content $file $content -NoNewline
        Write-Host "Patched prepare.py successfully (diffutils, jom->nmake, dav1d)"

    - name: Apply Neon UI changes
      shell: pwsh
      run: |
        Copy-Item -Force neon/Telegram/SourceFiles/window/window.style src/Telegram/SourceFiles/window/window.style
        Copy-Item -Force neon/Telegram/SourceFiles/dialogs/ui/dialogs_layout.cpp src/Telegram/SourceFiles/dialogs/ui/dialogs_layout.cpp
        Copy-Item -Force neon/Telegram/SourceFiles/dialogs/dialogs.style src/Telegram/SourceFiles/dialogs/dialogs.style
        Copy-Item -Force neon/Telegram/SourceFiles/ui/chat/chat.style src/Telegram/SourceFiles/ui/chat/chat.style

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Prepare libraries (Qt, vcpkg, ffmpeg...)
      working-directory: src/Telegram
      run: python build/prepare/prepare