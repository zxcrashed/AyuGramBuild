name: Build AyuGram Neon UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Neon patch repo
      uses: actions/checkout@v4
      with:
        path: neon

    - name: Clone official AyuGram v7.2.9 with submodules
      run: git clone --recursive --shallow-submodules --depth 1 --branch v7.2.9 https://github.com/AyuGram/AyuGramDesktop.git src

    - name: Patch prepare.py (bulletproof)
      shell: pwsh
      run: |
        $script = @'
        import re

        with open('src/Telegram/build/prepare/prepare.py', 'r', encoding='utf-8') as f:
            content = f.read()

        # 1. Fix outdated MSYS2 package
        content = content.replace('mingw-w64-x86_64-diffutils', 'diffutils')
        
        # 2. Replace jom with nmake (remove parallel args)
        content = re.sub(r'jom\s+-j\S*\s+', 'nmake ', content)
        content = re.sub(r'jom\s+', 'nmake ', content)

        # 3. Fix dav1d __has_include_next error by injecting a native python one-liner
        # This completely avoids cmd/powershell quote escaping hell
        pattern = re.compile(r"^(\s*)'cd dav1d',$", re.MULTILINE)
        def replacer(match):
            indent = match.group(1)
            return f"""{indent}'cd dav1d',
{indent}'python -c "import re; f=\\'include/compat/msvc/stdatomic.h\\'; open(f, \\'w\\').write(re.sub(r\\'#if __has_include_next\\\\s*\\\\(\\\\s*<stdatomic\\\\.h>\\\\s*\\\\)\\', \\'#if 0\\', open(f).read()))",
"""
        content = pattern.sub(replacer, content)

        with open('src/Telegram/build/prepare/prepare.py', 'w', encoding='utf-8') as f:
            f.write(content)

        print('Patched prepare.py successfully (diffutils, jom->nmake, dav1d)')
        '@
        python -c $script

    - name: Apply Neon UI changes
      shell: pwsh
      run: |
        Copy-Item -Force neon/Telegram/SourceFiles/window/window.style src/Telegram/SourceFiles/window/window.style
        Copy-Item -Force neon/Telegram/SourceFiles/dialogs/ui/dialogs_layout.cpp src/Telegram/SourceFiles/dialogs/ui/dialogs_layout.cpp
        Copy-Item -Force neon/Telegram/SourceFiles/dialogs/dialogs.style src/Telegram/SourceFiles/dialogs/dialogs.style
        Copy-Item -Force neon/Telegram/SourceFiles/ui/chat/chat.style src/Telegram/SourceFiles/ui/chat/chat.style

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Prepare libraries (Qt, vcpkg, ffmpeg...)
      working-directory: src/Telegram
      run: python build/prepare/prepare.py

    - name: Configure project
      working-directory: src/Telegram
      run: cmd /c configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

    - name: Build Release
      run: cmake --build src/out --config Release -j 3

    - name: Upload artifact (готовый клиент)
      uses: actions/upload-artifact@v4
      with:
        name: AyuGram-Neon-UI
        path: src/out/Release/
        retention-days: 14